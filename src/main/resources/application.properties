spring.application.name=chatmosphere-backend

# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chatmosphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/chatmosphere}
spring.data.mongodb.database=${SPRING_MONGODB_DATABASE:chatmosphere}

# CORS & Server
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:5173}
server.error.include-message=always

# JWT Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d}
jwt.expiration=${JWT_EXPIRATION:86400000}
